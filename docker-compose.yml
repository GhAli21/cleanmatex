# docker-compose.yml
services:
  # Redis (Cache & Queue)
  redis:
    image: redis:7-alpine
    container_name: cmx-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cmx-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Commander (Redis GUI - Optional)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: cmx-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    networks:
      - cmx-network
    depends_on:
      - redis

volumes:
  redis_data:

networks:
  cmx-network:
    driver: bridge
    